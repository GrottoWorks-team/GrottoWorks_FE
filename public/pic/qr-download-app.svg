<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="QR code placeholder">
  <!--
    ẢNH PLACEHOLDER cho mã QR tải ứng dụng GrottoWorks.
    Thay file này bằng mã QR thật (cùng tên, cùng thư mục public/pic/) khi app phát hành.
  -->
  <defs>
    <pattern id="qr-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" rx="1.6" fill="#0A5C36" opacity="0.20" />
      <rect x="10" y="10" width="8" height="8" rx="1.6" fill="#0A5C36" opacity="0.10" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="22" fill="#FFFFFF" />
  <rect x="16" y="16" width="224" height="224" rx="14" fill="url(#qr-dots)" />

  <!-- Khung quét 4 góc -->
  <g stroke="#0A5C36" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M22 48 V22 H48" />
    <path d="M208 22 H234 V48" />
    <path d="M234 208 V234 H208" />
    <path d="M48 234 H22 V208" />
  </g>

  <!-- Ô định vị (finder patterns) -->
  <g fill="#0A5C36">
    <rect x="44" y="44" width="44" height="44" rx="9" />
    <rect x="168" y="44" width="44" height="44" rx="9" />
    <rect x="44" y="168" width="44" height="44" rx="9" />
  </g>
  <g fill="#FFFFFF">
    <rect x="57" y="57" width="18" height="18" rx="5" />
    <rect x="181" y="57" width="18" height="18" rx="5" />
    <rect x="57" y="181" width="18" height="18" rx="5" />
  </g>

  <!-- Huy hiệu trung tâm: cây thông GrottoWorks -->
  <rect x="92" y="92" width="72" height="72" rx="18" fill="#0A5C36" />
  <rect x="99" y="99" width="58" height="58" rx="13" fill="#FFFFFF" />
  <path d="M128 106 L142 132 H114 Z" fill="#0A5C36" />
  <path d="M128 120 L147 152 H109 Z" fill="#0A5C36" />
  <rect x="124" y="150" width="8" height="11" rx="2" fill="#EEB902" />
  <circle cx="128" cy="102" r="4" fill="#EEB902" />
</svg>
